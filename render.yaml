services:
  - type: web
    name: multi-agent-story-web
    env: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: multi-agent-story-db
          property: connectionString
      # Optional public-origin override. Leave this unset to use Render's RENDER_EXTERNAL_URL.
      - key: APP_URL
        sync: false

  - type: worker
    name: multi-agent-story-worker
    env: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: multi-agent-story-db
          property: connectionString

databases:
  - name: multi-agent-story-db
    databaseName: story
    user: story
    plan: starter
