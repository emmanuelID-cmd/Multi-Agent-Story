services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: story
      POSTGRES_DB: story
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - story_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  story_database:
